# Put custom.scm right after directory
format = """
$os\
$username\
$hostname\
$directory\
${custom.jj}\
$all\
$line_break\
$character"""

palette = 'osmium'

[buf]
disabled = true

[username]
style_user = "blue bold"
style_root = "red bold"
format = "[$user]($style)"
disabled = false
show_always =true 

[hostname]
ssh_only = false 
format = "[@$hostname](bold yellow) "
disabled = false

[character]
error_symbol = "[󱞩 ](bold red)"
success_symbol = "[󱞩 ](bold green)"

[line_break]
disabled = false

[directory]
truncate_to_repo = false
truncation_length = 5
fish_style_pwd_dir_length = 1
style = "cyan bold"
format = "[$path]($style)[$read_only]($read_only_style) "

[os]
disabled = false
style = "blue bold"
format = "[$symbol]($style) "

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = " "
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[dotnet]
detect_files = ["global.json", "Directory.Build.props", "Directory.Build.targets", "Packages.props"]

[git_branch]
disabled = true
symbol = " "
truncation_length = 18

[git_status]
disabled = true

[git_commit]
disabled = true

[custom.jj]
command = "jj-starship --truncate-name 20 --bookmarks-display-limit 10"
when = "jj-starship detect"
shell = ["sh"]
format = "$output "

# ── Toolchains: icon + major.minor only ────────────────────────────────

[nodejs]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[deno]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[bun]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[nix_shell]
symbol = " "
format = "[$symbol]($style)"

[package]
disabled = true

[palettes.osmium]
# Based on osmium-colors theme
red = "#E55376"
green = "#C9DE96"
yellow = "#E9D39C"
blue = "#9ABFE8"
purple = "#B0A8EB"
pink = "#D9A1E8"
peach = "#E9D39C"
lavender = "#B0A8EB"
sapphire = "#8CAAD1"
text = "#C8D5F1"
subtext1 = "#949BB9"
subtext0 = "#747A9C"
overlay2 = "#747A9C"
overlay1 = "#747A9C"
overlay0 = "#353553"
surface2 = "#353553"
surface1 = "#1F1D2D"
surface0 = "#1F1D2D"
base = "#14131E"
mantle = "#14131E"
crust = "#14131E"
