# Put custom.scm right after directory
format = """
$os\
$username\
$hostname\
$directory\
${custom.jj}\
$all\
$cmd_duration\
$line_break\
[  ]()$character"""

palette = 'onedark'

[buf]
disabled = true

[username]
style_user = "blue bold"
style_root = "red bold"
format = "[$user]($style)"
disabled = false
show_always =true 

[hostname]
ssh_only = false 
format = "[@$hostname](bold yellow) "
disabled = false

[character]
error_symbol = "[󱞩 ](bold red)"
success_symbol = "[󱞩 ](bold green)"

[cmd_duration]
min_time = 500
show_milliseconds = true
format = "took [$duration]($style) "
style = "blue"

[container]
format = "[$symbol]($style) "
symbol = "󰡨"
style = "purple"

[shell]
disabled = false
bash_indicator = ""
zsh_indicator = "󰰶"
fish_indicator = "󰈺"
nu_indicator = "󱆃"
format = "[$indicator]($style) "
style = "cyan"

[line_break]
disabled = false

[directory]
truncate_to_repo = false
truncation_length = 5
fish_style_pwd_dir_length = 1
style = "cyan bold"
format = "[$path]($style)[$read_only]($read_only_style) "

[os]
disabled = false
style = "blue bold"
format = "[$symbol]($style) "

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵 "
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇 "
Artix = "󰣇 "
CachyOS = " "
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[dotnet]
detect_files = ["global.json", "Directory.Build.props", "Directory.Build.targets", "Packages.props"]

[git_branch]
disabled = true
symbol = " "
truncation_length = 18

[git_status]
disabled = true

[git_commit]
disabled = true

[custom.jj]
# command = "jj-starship --truncate-name 20 --bookmarks-display-limit 10"
when = "jj-starship detect"
shell = ["jj-starship"]
format = "$output "

# ── Toolchains: icon + major.minor only ────────────────────────────────

[nodejs]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[deno]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[bun]
symbol = " "
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[nix_shell]
symbol = " "
format = "[$symbol]($style)"

[package]
disabled = true

[palettes.onedark]
# OneDark Pro theme
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
purple = "#c678dd"
pink = "#c678dd"
peach = "#d19a66"
lavender = "#c678dd"
sapphire = "#56b6c2"
cyan = "#56b6c2"
text = "#abb2bf"
subtext1 = "#9da5b4"
subtext0 = "#848b98"
overlay2 = "#7f848e"
overlay1 = "#636d83"
overlay0 = "#5c6370"
surface2 = "#4b5263"
surface1 = "#3e4451"
surface0 = "#323842"
base = "#282c34"
mantle = "#21252b"
crust = "#1b1f23"
