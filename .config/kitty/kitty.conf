font_family CaskaydiaMono Nerd Font Mono
font_size 16.0

shell_integration no-cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_shape block

# Copy to clipboard
map ctrl+c copy_or_interrupt 

# Paste from clipboard
map ctrl+v paste_from_clipboard

confirm_os_window_close 0

# Colors

foreground #979eab
background #282c34

scrollback_lines 10000
wheel_scroll_multiplier 1.0
touch_scroll_multiplier 1.0
pixel_scroll yes
momentum_scroll 0.96

# One dark pro

color0 #282c34
color1 #e06c75
color2 #98c379
color3 #e5c07b
color4 #61afef
color5 #be5046
color6 #56b6c2
color7 #979eab
color8 #393e48
color9 #d19a66
color10 #56b6c2
color11 #e5c07b
color12 #61afef
color13 #be5046
color14 #56b6c2
color15 #abb2bf

# Tab Bar

active_tab_foreground   #282c34
active_tab_background   #979eab
inactive_tab_foreground #abb2bf
inactive_tab_background #282c34
