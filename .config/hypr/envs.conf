# Cursor size and theme
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_THEME,catppuccin-mocha-dark-cursors

# Force all apps to use Wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland

# Allow better support for screen sharing (Google Meet, Discord, etc)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Use XCompose file
env = XCOMPOSEFILE,~/.XCompose

# Fix keyboard layout for XWayland applications
env = XKB_DEFAULT_LAYOUT,fi
env = XKB_DEFAULT_MODEL,pc105
env = XKB_DEFAULT_OPTIONS,compose:caps

# Force dark mode for all applications
env = GTK_THEME,Breeze-Dark:dark
env = QT_QPA_PLATFORMTHEME,qt6ct
env = COLOR_SCHEME,prefer-dark

