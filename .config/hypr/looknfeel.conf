
# OneDark Pro color palette
$activeBorderColor = rgba(61afefee)  # OneDark Blue
$inactiveBorderColor = rgba(3e4451aa)  # OneDark Gray (gutter)

#for libadwaita gtk4 apps you can use this command:
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#for gtk3 apps you need to install adw-gtk3 theme (in arch linux sudo pacman -S adw-gtk-theme)
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps

#for kde apps you need to install: sudo pacman -S qt5ct qt6ct kvantum kvantum breeze-icons   
#you will need to set dark theme for qt apps from kde more difficult thans with gnome :D:
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    # gaps_in = 0
    # gaps_out = 0

    # Use master layout instead of dwindle
     # layout = dwindle 
  layout = scrolling
  allow_tearing = false
  resize_on_border = true
  
  # OneDark Pro theme colors
  col.active_border = $activeBorderColor
  col.inactive_border = $inactiveBorderColor
  col.nogroup_border = rgba(56b6c2ee)  # OneDark Cyan
  col.nogroup_border_active = rgba(c678ddee)  # OneDark Purple
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = rgba(e5c07bee)  # OneDark Yellow
    col.border_locked_inactive = rgba(5c6370aa)  # OneDark Comment Gray
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
     rounding = 2 
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
  # single_window_aspect_ratio = 1 1
}

scrolling {
    # Only 50% and 100% for clean toggle with SUPER+B
    explicit_column_widths = 0.5, 1.0
}

misc {
    background_color = rgb(282c34)  # OneDark Background
    disable_splash_rendering = true
    disable_hyprland_logo = true
}

windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

# windowrule = opacity 0.98 0.98, class:.*
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


windowrule {
  name = windowrule-firefox
  opacity = 0.98
  match:class = ^(firefox)$
}

windowrule {
  name = windowrule-ghostty
  opacity = 0.90 
  
  match:class = ^(com.mitchellh.ghostty)$
}

windowrule {
  name = windowrule-discord
  opacity = 0.90
  match:class = ^(discord)$
}

windowrule {
  name = windowrule-3
  opacity = 0.90
  match:class = ^([Ss]team)$
}

windowrule {
  name = windowrule-4
  opacity = 0.80 0.70
  match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
}

windowrule {
  name = windowrule-5
  opacity = 0.80 0.70
  match:class = ^(polkit-gnome-authentication-agent-1)$
}


animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 2.5, md3_decel
    animation = workspaces, 1, 3.5, easeOutExpo, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}


