name: Update Neovim Lazy Lock File

on:
  schedule:
    # Every Wednesday at 06:00 UTC
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    env:
      BRANCH_NAME: auto/nvim-lazy-update
      PR_TITLE: "chore: update lazy-lock.json"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Neovim (latest stable)
        run: |
          curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim version
        run: nvim --version | head -3

      - name: Update lazy-lock.json
        run: |
          export XDG_CONFIG_HOME="$GITHUB_WORKSPACE/.config"
          # Run Lazy update headlessly, then quit
          nvim --headless \
            +"lua require('lazy').update({ wait = true })" \
            +qa \
            || true

      - name: Check for lock file changes
        id: changes
        run: |
          if git diff --quiet .config/nvim/lazy-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to lock file"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Lock file has changes:"
            git diff --stat .config/nvim/lazy-lock.json
          fi

      - name: Check for existing PR
        if: steps.changes.outputs.changed == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "Found existing PR #$PR_NUMBER"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing PR found"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OLD_HASH=""
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            OLD_HASH=$(git ls-remote origin "$BRANCH_NAME" | cut -f1)
            echo "old_hash=${OLD_HASH:0:7}" >> "$GITHUB_OUTPUT"
          fi

          git checkout -B "$BRANCH_NAME"

          git add .config/nvim/lazy-lock.json
          git commit -m "chore: update lazy-lock.json"

          git push --force-with-lease origin "$BRANCH_NAME"

          NEW_HASH=$(git rev-parse --short HEAD)
          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"

      - name: Comment on existing PR (rebase notice)
        if: steps.changes.outputs.changed == 'true' && steps.existing_pr.outputs.pr_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.existing_pr.outputs.pr_number }}" \
            --body "Rebased from \`${{ steps.push.outputs.old_hash }}\` to \`${{ steps.push.outputs.new_hash }}\` due to PR age being potentially stale."

      - name: Create new PR
        if: steps.changes.outputs.changed == 'true' && steps.existing_pr.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "$PR_TITLE" \
            --head "$BRANCH_NAME" \
            --base master \
            --body "## Automated Neovim Plugin Update

          This PR updates \`.config/nvim/lazy-lock.json\` with the latest plugin revisions.

          Generated by running \`require('lazy').update()\` on Neovim stable.

          **Review the lock file diff to verify the plugin updates look reasonable before merging.**

          > This PR is automatically rebased weekly on Wednesdays. If left unmerged for a week,
          > a new force-push will refresh the updates and a comment will be added."
